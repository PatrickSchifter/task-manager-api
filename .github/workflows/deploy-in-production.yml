name: Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: Production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          timeout: 300s
          command_timeout: 300s
          script: |
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            # Aborta o deploy se qualquer passo abaixo falhar (build, generate,
            # migração) — assim nunca reiniciamos a API contra um banco em estado
            # inconsistente.
            set -e
            cd task-manager
            git reset --hard HEAD && git pull origin main
            pnpm i
            pnpm run build
            pnpm prisma generate
            # Aplica automaticamente as migrações pendentes em produção.
            # Idempotente: não faz nada quando não há migração nova e nunca reseta
            # o banco. Cobre qualquer futura mudança de schema sem acesso manual.
            pnpm prisma migrate deploy
            pm2 restart api